name: Release Packaging & Multi-Platform Distribution

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Package Multi-Platform Releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build React Studio & Prepare Server
        run: |
          echo "Building React Studio Client..."
          cd studio/client
          npm ci --ignore-scripts || npm install
          npm run build
          cd ../..

          echo "Installing Studio Backend Dependencies..."
          # Installing Studio Backend Dependencies including Electron
          cd studio/server
          npm install
          node node_modules/electron/install.js || true
          cd ../..

      - name: Create Release Bundles
        run: |
          VERSION="${GITHUB_REF_NAME:-v1.0.0}"
          echo "Packaging R-TRCE Code Assistant $VERSION..."

          mkdir -p dist/linux dist/macos dist/windows

          # 1. Linux Bundle (contains Linux Electron runtime)
          mkdir -p dist/linux/rtrce-code-assistant
          cp -r r_trce.R app.R start_studio.sh start_react_studio.sh install.sh README.md LICENSE AGENTS.md Context.md R samples registry www studio dist/linux/rtrce-code-assistant/
          rm -rf dist/linux/rtrce-code-assistant/studio/client/node_modules
          if [ ! -f dist/linux/rtrce-code-assistant/studio/server/node_modules/electron/dist/electron ]; then
            echo "Downloading Linux Electron desktop runtime directly..."
            curl -fsSL https://github.com/electron/electron/releases/download/v44.5.1/electron-v44.5.1-linux-x64.zip -o electron-linux.zip
            mkdir -p dist/linux/rtrce-code-assistant/studio/server/node_modules/electron/dist
            unzip -q electron-linux.zip -d dist/linux/rtrce-code-assistant/studio/server/node_modules/electron/dist/
            rm electron-linux.zip
          fi
          chmod +x dist/linux/rtrce-code-assistant/r_trce.R dist/linux/rtrce-code-assistant/app.R dist/linux/rtrce-code-assistant/start_studio.sh dist/linux/rtrce-code-assistant/start_react_studio.sh dist/linux/rtrce-code-assistant/install.sh
          if [ -f dist/linux/rtrce-code-assistant/studio/server/node_modules/electron/dist/electron ]; then
            chmod +x dist/linux/rtrce-code-assistant/studio/server/node_modules/electron/dist/electron
          fi
          tar -czf dist/rtrce-code-assistant-linux-all.tar.gz -C dist/linux rtrce-code-assistant

          # 2. macOS Bundle (inject macOS Electron runtime)
          mkdir -p dist/macos/rtrce-code-assistant
          cp -r r_trce.R app.R start_studio.sh start_react_studio.sh install.sh README.md LICENSE AGENTS.md Context.md R samples registry www studio dist/macos/rtrce-code-assistant/
          rm -rf dist/macos/rtrce-code-assistant/studio/client/node_modules
          echo "Injecting macOS Electron desktop runtime..."
          curl -fsSL https://github.com/electron/electron/releases/download/v44.5.1/electron-v44.5.1-darwin-x64.zip -o electron-mac.zip
          mkdir -p dist/macos/rtrce-code-assistant/studio/server/node_modules/electron/dist
          rm -rf dist/macos/rtrce-code-assistant/studio/server/node_modules/electron/dist/*
          unzip -q electron-mac.zip -d dist/macos/rtrce-code-assistant/studio/server/node_modules/electron/dist/
          rm electron-mac.zip
          chmod +x dist/macos/rtrce-code-assistant/r_trce.R dist/macos/rtrce-code-assistant/app.R dist/macos/rtrce-code-assistant/start_studio.sh dist/macos/rtrce-code-assistant/start_react_studio.sh dist/macos/rtrce-code-assistant/install.sh
          tar -czf dist/rtrce-code-assistant-macos-all.tar.gz -C dist/macos rtrce-code-assistant

          # 3. Windows 10 & 11 Bundle (inject Windows Electron runtime)
          mkdir -p dist/windows/rtrce-code-assistant
          cp -r r_trce.R app.R start_studio.bat start_react_studio.bat start_react_studio.ps1 install.bat install.ps1 README.md LICENSE AGENTS.md Context.md R samples registry www studio dist/windows/rtrce-code-assistant/
          rm -rf dist/windows/rtrce-code-assistant/studio/client/node_modules
          echo "Injecting Windows Electron desktop runtime..."
          curl -fsSL https://github.com/electron/electron/releases/download/v44.5.1/electron-v44.5.1-win32-x64.zip -o electron-win.zip
          mkdir -p dist/windows/rtrce-code-assistant/studio/server/node_modules/electron/dist
          rm -rf dist/windows/rtrce-code-assistant/studio/server/node_modules/electron/dist/*
          unzip -q electron-win.zip -d dist/windows/rtrce-code-assistant/studio/server/node_modules/electron/dist/
          rm electron-win.zip
          zip -r dist/rtrce-code-assistant-windows-all.zip dist/windows/rtrce-code-assistant

          # Standalone installer scripts and license for direct download
          cp install.sh dist/install.sh
          cp install.ps1 dist/install.ps1
          cp install.bat dist/install.bat
          cp start_react_studio.bat dist/start_react_studio.bat
          cp start_react_studio.sh dist/start_react_studio.sh
          cp LICENSE dist/LICENSE

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/rtrce-code-assistant-windows-all.zip
            dist/rtrce-code-assistant-linux-all.tar.gz
            dist/rtrce-code-assistant-macos-all.tar.gz
            dist/install.sh
            dist/install.ps1
            dist/install.bat
            dist/start_react_studio.bat
            dist/start_react_studio.sh
          name: "R-TRCE Code Assistant ${{ github.ref_name }}"
          draft: false
          prerelease: false
          body: |
            ## R-TRCE Code Assistant Release ${{ github.ref_name }}
            
            Multi-platform native desktop release of R-TRCE Code Assistant:
            - **Native Desktop Studio**: Local Electron desktop IDE powered by Monaco Editor, Asterov Catppuccin theme, live TRCE telemetry badges, polyglot AST archetype explorer (R, Python, JavaScript), interactive REPL, and plot gallery.
            - **Zero Prerequisites**: Desktop Electron runtimes are bundled directly in the releases for Windows and Linux — no system Node.js or browser needed.
            - **CLI Router**: Complete architectural analysis, 6-point TRCE doc-comment synthesizer, and student pitfall sentinel.
            
            ---
            
            ### 🚀 Standalone Releases (Easiest & Most Direct)
            
            Download the pre-packaged bundle for your platform below — no build steps or git clone needed:
            
            | Platform | Download | Instructions |
            | :--- | :--- | :--- |
            | **🪟 Windows 10 & 11** | [`rtrce-code-assistant-windows-all.zip`](https://github.com/AsterovLabs/R-TRCE-Code-Assistant/releases/download/${{ github.ref_name }}/rtrce-code-assistant-windows-all.zip) | **1.** Unzip the folder.<br>**2.** Double-click **`start_react_studio.bat`** (or `start_studio.bat`). |
            | **🐧 Linux** | [`rtrce-code-assistant-linux-all.tar.gz`](https://github.com/AsterovLabs/R-TRCE-Code-Assistant/releases/download/${{ github.ref_name }}/rtrce-code-assistant-linux-all.tar.gz) | **1.** Extract archive: `tar -xzf rtrce-code-assistant-linux-all.tar.gz`<br>**2.** Run: `./start_react_studio.sh` |
            | **🍏 macOS** | [`rtrce-code-assistant-macos-all.tar.gz`](https://github.com/AsterovLabs/R-TRCE-Code-Assistant/releases/download/${{ github.ref_name }}/rtrce-code-assistant-macos-all.tar.gz) | **1.** Extract archive.<br>**2.** Run: `./start_react_studio.sh` |
            
            ---
            
            ### ⚡ 1-Minute Terminal Quick Install
            
            #### 🐧 Linux & 🍏 macOS
            ```bash
            curl -fsSL https://raw.githubusercontent.com/AsterovLabs/R-TRCE-Code-Assistant/main/install.sh | bash
            ```
            Once installed, run `rtrce-react-studio` or `rtrce-studio`.
            
            #### 🪟 Windows 11 & Windows 10 (PowerShell)
            ```powershell
            irm https://raw.githubusercontent.com/AsterovLabs/R-TRCE-Code-Assistant/main/install.ps1 | iex
            ```
            Once installed, run `rtrce-react-studio` or `rtrce-studio`.
