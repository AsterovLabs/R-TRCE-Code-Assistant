<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- 
    @trce-id trce-website-icon-asterov-001
    @trce-who User / Design System
    @trce-what Renders Asterov Monorepo Icon (Catppuccin Lavender/Blue Gradient Monogram)
    @trce-where apps/website/public/asterov-icon.svg
    @trce-when Client icon asset request
    @trce-why Official icon for Asterov Monorepo card matching Asterov Control Center branding
    @trce-how SVG vector graphic with rounded rectangle container and gradient A/C stroke path
  -->
  <defs>
    <linearGradient id="bg-asterov" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="accent-asterov" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="50%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#94e2d5"/>
    </linearGradient>
    <linearGradient id="inner-glow-asterov" x1="128" y1="0" x2="128" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(203,166,247,0.15)"/>
      <stop offset="100%" stop-color="rgba(137,180,250,0.05)"/>
    </linearGradient>
    <filter id="shadow-asterov" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#cba6f7" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" ry="52" fill="url(#bg-asterov)" stroke="url(#accent-asterov)" stroke-width="10"/>
  <rect x="8" y="8" width="240" height="240" rx="52" ry="52" fill="url(#inner-glow-asterov)"/>
  <path d="M144 72C144 72 120 56 96 64C72 72 56 92 56 116V140C56 164 72 184 96 192C120 200 144 184 144 184" stroke="url(#accent-asterov)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M184 64V192" stroke="url(#accent-asterov)" stroke-width="32" stroke-linecap="round" fill="none"/>
  <circle cx="212" cy="64" r="14" fill="#cba6f7" opacity="0.8">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
